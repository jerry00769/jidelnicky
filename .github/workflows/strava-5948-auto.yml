name: Automaticke nacteni Strava.cz 5948
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5,12 * * *'
permissions:
  contents: write
concurrency:
  group: strava-5948-public-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalace knihoven
        run: python -m pip install 'strava-cz-api==2.5.7' 'requests>=2.31,<3'
      - name: Nacteni a kontrola verejnych jidel
        run: python scripts/fetch_strava_5948.py
      - name: Ulozeni pouze verejneho souboru pro web
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add strava_5948.json
          if git diff --cached --quiet; then
            echo 'Bez zmeny kandidatu.'
          else
            git commit -m 'Strava.cz 5948: aktualizace verejnych kandidatu'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
