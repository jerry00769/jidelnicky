name: Test nacitani Strava.cz 5948

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install public Strava.cz API client
        run: python -m pip install 'strava-cz-api==2.5.7' 'requests>=2.31,<3'

      - name: Convert public menu to safe weekly candidates
        run: python scripts/test_strava_5948.py

      - name: Upload weekly candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strava-5948-kandidati
          path: strava_5948_kandidati.json
          if-no-files-found: error
          retention-days: 7
